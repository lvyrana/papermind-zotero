name: Feature request
description: Suggest an improvement to the Zotero reading workflow
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Reading problem
      description: Describe the workflow friction before proposing a feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
